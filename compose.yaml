services:
  msx:
    image: ${MSX_IMAGE:-ghcr.io/dexogen/msx-channels:latest}
    init: true
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (at least 12 characters)}
      OUTPUT_FPS: ${OUTPUT_FPS:-30}
      CRF: ${CRF:-20}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      PREPARE_JOBS: ${PREPARE_JOBS:-1}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
    volumes:
      - type: bind
        source: ${VIDEO_DIR:-./videos}
        target: /media
        bind:
          create_host_path: false
      - cache:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cache:
